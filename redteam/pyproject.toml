[project]
name = 'redteam'
version = '0.1.0'
description = 'PasteWarden red/blue loop: variant generation, sandboxed syntax validation, scoring, reports (docs/plan/phase-5.md).'
requires-python = '>=3.12'
license = 'MIT'
dependencies = [
  'pydantic>=2.10',
  'httpx>=0.28',
  'matplotlib>=3.10',
]

[project.scripts]
redteam = 'redteam.cli:main'

[dependency-groups]
dev = ['pytest>=8', 'ruff>=0.9', 'black>=25']

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/redteam']

[tool.black]
line-length = 80
# Black has no single-quote mode; keep the quotes we write and let Ruff's
# flake8-quotes rule enforce single quotes.
skip-string-normalization = true

[tool.ruff]
line-length = 80
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'B', 'UP', 'Q', 'S']
ignore = [
  # subprocess is only allowed in validate/sandbox.py, engine.py and blue/;
  # tests/test_static_guards.py enforces that instead of a blanket S603/S607.
  'S603',
  'S607',
]

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'
docstring-quotes = 'double'

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
