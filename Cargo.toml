[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/aionyx02/paste-warden"
publish = false

[workspace.dependencies]
paste-warden-core = { path = "crates/core" }
paste-warden-rules = { path = "crates/rules" }
paste-warden-i18n = { path = "crates/i18n" }
paste-warden-corpus = { path = "crates/corpus" }
paste-warden-conformance = { path = "crates/conformance" }
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
bech32 = "0.12"
bs58 = "0.5"
fluent-bundle = "0.16"
hmac = "0.13"
sha2 = "0.11"
toml = "1"
unic-langid = "0.9"
unicode-normalization = "0.1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
