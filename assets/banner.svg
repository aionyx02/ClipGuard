    <rect x="55" y="17" width="18" height="7" rx="3.5" fill="#1E3A8A"/>
    <path d="M43 68l15 15 28-31" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="520" y="194" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="92" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Paste<tspan fill="#5EEAD4">Warden</tspan></text>
