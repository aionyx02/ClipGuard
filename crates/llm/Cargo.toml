[package]
name = "paste-warden-llm"
description = "Optional LLM providers (OpenAI-compatible, Anthropic) with code-enforced guardrails. Off by default."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The HTTP client (`ureq`, rustls). Without it the crate only offers the
# `Transport` trait; core, rules and wasm never depend on this crate.
net = ["dep:ureq"]

[dependencies]
paste-warden-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
