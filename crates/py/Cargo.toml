[package]
name = "paste-warden-py"
description = "PyO3 bindings used by the red-team tooling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "paste_warden"
crate-type = ["cdylib"]

[features]
# The binding itself. Off by default so `cargo build/test/clippy --workspace`
# never needs a Python interpreter or libpython; maturin enables it
# (pyproject.toml `tool.maturin.features`).
python = ["dep:pyo3", "dep:paste-warden-core", "dep:paste-warden-wasm"]

[dependencies]
paste-warden-core = { workspace = true, optional = true }
# Report JSON, masking and deobfuscation previews shared with the WASM binding.
paste-warden-wasm = { path = "../wasm", default-features = false, optional = true }
pyo3 = { workspace = true, optional = true }

[lints]
workspace = true
