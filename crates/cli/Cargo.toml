[package]
name = "paste-warden-cli"
description = "paste-warden command line: scan, mask, agent hooks, MCP server, bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "paste_warden_cli"
path = "src/lib.rs"

[[bin]]
name = "paste-warden"
path = "src/main.rs"

[dependencies]
paste-warden-core.workspace = true
paste-warden-i18n.workspace = true
# Tier 2 (phase-5.md §5.6); the HTTP client only exists in this crate's tree.
paste-warden-llm = { path = "../llm", features = ["net"] }
anyhow.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
# preserve_order: `hook install` keeps the key order of the user's settings.json.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
paste-warden-report.workspace = true
assert_cmd.workspace = true
paste-warden-corpus.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
