name: extension

on:
  push:
    branches: [dev, main]
    paths: ['extension/**', 'rules/**', 'tools/**', 'tests/fixtures/**', '.github/workflows/extension.yml']
  pull_request:
    branches: [dev, main]
    paths: ['extension/**', 'rules/**', 'tools/**', 'tests/fixtures/**', '.github/workflows/extension.yml']

permissions:
  contents: read

jobs:
  extension-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
