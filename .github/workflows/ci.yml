name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install   # installs what rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: core and rules must build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p paste-warden-core -p paste-warden-rules -p paste-warden-wasm

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p xtask -- corpus lint
      - run: cargo run --locked -p xtask -- corpus coverage

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: release-mode performance budgets (ignored in debug test runs)
        env:
          PW_PERF_SLACK: "2"   # fail only beyond 2x the budget (phase-1.md §1.6)
        run: cargo test --release --locked -p paste-warden-core -- --include-ignored --test-threads=1

  redteam:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: redteam
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run black --check .
      - run: uv run pytest -q

  # phase-5.md §5.6: an HTTP client may only appear in crates/llm.
  no-http-in-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - name: core, rules and wasm have no HTTP client
        run: |
          for p in paste-warden-core paste-warden-rules paste-warden-wasm; do
            if cargo tree --locked -p "$p" -e normal --prefix none | grep -E '^(ureq|reqwest|hyper|isahc|curl) '; then
              echo "::error::$p depends on an HTTP client"; exit 1
            fi
          done

  # phase-5.md §5.5.3: blue-team branches may only touch rules and corpus.
  redteam-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: redteam/* branches only change rules/ and corpus/
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'redteam/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git diff --name-only "$BASE...$HEAD" | grep -vE '^(rules/|corpus/(cases|benign|divergences)/)' || true)
          if [ -n "$bad" ]; then echo "::error::paths outside rules/ and corpus/:"; echo "$bad"; exit 1; fi

  # Stable name for the branch ruleset's required check: passes only when every job above passes.
  build-test:
    if: always()
    needs: [rust, wasm, corpus, perf, redteam, no-http-in-core, redteam-paths]
    runs-on: ubuntu-latest
    steps:
      - name: all CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::a CI job did not succeed ($RESULTS)"; exit 1; fi
          done
