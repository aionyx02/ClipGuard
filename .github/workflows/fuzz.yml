name: fuzz

on:
  pull_request:
    branches: [dev, main]
    paths: ["crates/core/**", "crates/rules/**", "rules/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [command, secret, hidden_wallet, policy]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: run ${{ matrix.target }} for 60 s
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
      - name: keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
