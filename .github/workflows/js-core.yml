name: js-core

# @paste-warden/core: build the WASM and wasm2js engines, check the size budget,
# run the Node tests (corpus subset through both builds). docs/integrations/wasm.md

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: js-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install   # rust-toolchain.toml adds wasm32
      - uses: Swatinem/rust-cache@v2
      - name: raw C ABI unit tests (native)
        run: cargo test --locked -p paste-warden-wasm --all-features
      - name: raw-abi builds for wasm32
        run: cargo build --locked -p paste-warden-wasm --target wasm32-unknown-unknown --no-default-features --features raw-abi
      - name: install wasm-bindgen-cli (same version as the crate in Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-${v}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint (Biome + tsc)
        run: pnpm --filter @paste-warden/core lint
      - name: build (cargo → wasm-bindgen → wasm-opt -Oz; raw-abi → wasm2js)
        run: pnpm --filter @paste-warden/core build
      - name: size budget (gzip < 1.5 MB)
        run: pnpm --filter @paste-warden/core size
      - name: node tests (wasm + wasm2js)
        run: pnpm --filter @paste-warden/core test
